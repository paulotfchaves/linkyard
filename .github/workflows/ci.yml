name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: linkyard_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/linkyard_test

    steps:
      - uses: actions/checkout@v4
        with:
          # The gate sweeps the full history. A shallow clone would let a bad
          # commit through unseen.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Test
        run: npm test

      - name: Gate test
        run: bash scripts/test-scan.sh

      - name: Publication gate
        run: npm run scan
